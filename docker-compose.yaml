services:
  backend:
    container_name: backend
    image: backend
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    volumes:
      - ./app:/opt/app
      - ./scripts:/opt/scripts
      - ./alembic.ini:/opt/alembic.ini
    user: 1000:1000
    ports:
      - 8000:8000
    env_file:
      - .env
    entrypoint: bash ./scripts/entrypoint.sh backend
    tty: true
    stdin_open: true
    environment:
      - DB_CONNECTION__DATABASE_USER=${DB_CONNECTION__DATABASE_USER:-postgres}
      - DB_CONNECTION__DATABASE_NAME=${DB_CONNECTION__DATABASE_USER:-postgres}
      - DB_CONNECTION__DATABASE_PASSWORD=${DB_CONNECTION__DATABASE_PASSWORD:-postgres}
      - DB_CONNECTION__DATABASE_HOST=${DB_CONNECTION__DATABASE_HOST:-database}
      - DB_CONNECTION__DATABASE_PORT=${DB_CONNECTION__DATABASE_PORT:-5432}
      - COMMON__LOG_LEVEL=${COMMON__LOG_LEVEL:-DEBUG}
    
  database:
    container_name: database
    image: postgres:17.3-bookworm
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
